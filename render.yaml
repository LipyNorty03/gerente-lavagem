services:
  - type: web
    name: gerente-lavagem
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gerente-lavagem-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: gerente-lavagem-db
    plan: free
    databaseName: gerente_lavagem
    user: gerente_user
